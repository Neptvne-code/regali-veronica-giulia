<html lang="it">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⭐ I desideri di Veronica & Giulia ⭐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--rosa:#ff8fb8;--rosa-s:#ffc9dc;--rosa-c:#ffeef4;--rosa-d:#e8417e;--nero:#1b1418;--bianco:#fffaf7;--lilla:#c9b6f2;--giallo:#ffe17a}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:var(--nero);background:var(--rosa-c);min-height:100vh;overflow-x:hidden}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco svg{position:absolute;opacity:.9}
.wrap{max-width:1040px;margin:0 auto;padding:16px;position:relative;z-index:1}
header{position:relative;margin:14px 0 22px;background:var(--rosa);border:3px solid var(--nero);border-radius:34px 28px 38px 26px;box-shadow:8px 8px 0 var(--nero);padding:30px 20px 26px;text-align:center;overflow:hidden}
header .bg-star{position:absolute;opacity:.95}
h1{position:relative;font-family:'Bagel Fat One',cursive;font-weight:400;font-size:clamp(40px,10vw,86px);line-height:.95;margin:0;color:var(--bianco);-webkit-text-stroke:3px var(--nero);paint-order:stroke fill;text-shadow:5px 5px 0 var(--nero);letter-spacing:1px}
h1 .amp{color:var(--giallo)}
.sub{position:relative;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;margin:14px auto 0;display:inline-block;background:var(--bianco);border:2.5px solid var(--nero);border-radius:999px;padding:6px 18px;transform:rotate(-2deg)}
.card{background:var(--bianco);border:3px solid var(--nero);border-radius:26px 20px 28px 18px;box-shadow:6px 6px 0 var(--nero);padding:18px;position:relative}
.countdown{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px}
.cd{text-align:center;padding:16px 10px 14px}
.cd.v{background:var(--bianco);transform:rotate(-1.2deg)}
.cd.g{background:var(--nero);color:var(--bianco);transform:rotate(1.2deg);box-shadow:6px 6px 0 var(--rosa-d)}
.cd .nome{font-family:'Bagel Fat One',cursive;font-size:30px}
.cd .num{font-family:'Bagel Fat One',cursive;font-size:64px;line-height:1;color:var(--rosa-d)}
.cd.g .num{color:var(--rosa)}
.cd .data{font-family:'Fredoka',sans-serif;font-weight:500;font-size:14px}
.cd .badge{position:absolute;top:-30px;right:-12px;width:74px;height:auto}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
form h2,.full{grid-column:1/-1}
h2{font-family:'Bagel Fat One',cursive;font-weight:400;margin:0 0 4px;font-size:30px}
label{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;display:block;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:10px 13px;border:2.5px solid var(--nero);border-radius:16px;background:var(--rosa-c);color:var(--nero)}
input[type=file]{padding:7px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;background:var(--bianco);box-shadow:3px 3px 0 var(--rosa-d)}
button{font-family:'Fredoka',sans-serif;font-size:16px;cursor:pointer;border:2.5px solid var(--nero);border-radius:999px;padding:9px 20px;background:var(--rosa);color:var(--nero);font-weight:700;box-shadow:3px 3px 0 var(--nero);transition:transform .1s,box-shadow .1s}
button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--nero)}
button:active{transform:translate(3px,3px);box-shadow:none}
button.sec{background:var(--bianco)}
.azioni{display:flex;gap:8px;flex-wrap:wrap}
.anteprima{max-width:130px;max-height:130px;border-radius:18px;border:2.5px solid var(--nero);display:none;margin-top:6px}
.barra{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.barra input{flex:1;min-width:200px;background:var(--bianco);box-shadow:3px 3px 0 var(--nero)}
.filtri{display:flex;gap:8px;flex-wrap:wrap}
.filtri button{padding:7px 16px;font-size:15px;background:var(--bianco)}
.filtri button.on{background:var(--nero);color:var(--bianco);box-shadow:3px 3px 0 var(--rosa-d)}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.item{padding:0;overflow:hidden;display:flex;flex-direction:column}
.item:nth-child(3n+1){transform:rotate(-.8deg)}.item:nth-child(3n+2){transform:rotate(.7deg)}
.item .foto{aspect-ratio:1/1;background:var(--rosa-s);display:flex;align-items:center;justify-content:center;font-size:54px;border-bottom:3px solid var(--nero)}
.item:nth-child(4n+2) .foto{background:var(--lilla)}.item:nth-child(4n+3) .foto{background:var(--giallo)}
.item .foto img{width:100%;height:100%;object-fit:cover}
.item .corpo{padding:13px;flex:1;display:flex;flex-direction:column;gap:7px}
.item h3{margin:0;font-family:'Fredoka',sans-serif;font-weight:700;font-size:20px;line-height:1.15}
.tag{display:inline-block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:12px;padding:2px 11px;border-radius:999px;border:2px solid var(--nero);margin-right:4px}
.tag.v{background:var(--rosa)}.tag.gi{background:var(--nero);color:var(--bianco)}.tag.c{background:var(--bianco)}
.prezzo{font-family:'Bagel Fat One',cursive;font-size:20px;color:var(--rosa-d)}
.note{font-size:14px;white-space:pre-wrap}
.item a.link{color:var(--nero);font-weight:700;font-size:14px}
.item .azioni button{padding:5px 13px;font-size:14px}
.vuoto{text-align:center;padding:40px 20px;font-family:'Fredoka',sans-serif;font-size:18px;grid-column:1/-1}
.vuoto svg{display:block;margin:0 auto 10px}
.stato{position:fixed;bottom:12px;right:12px;background:var(--bianco);border:2.5px solid var(--nero);border-radius:999px;padding:6px 14px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;box-shadow:3px 3px 0 var(--nero);z-index:9}
footer{text-align:center;margin:34px 0 70px;font-family:'Fredoka',sans-serif;font-weight:500;font-size:14px}
footer button{font-size:13px;padding:5px 13px;margin:4px}
@media(max-width:600px){header{padding:24px 12px 20px;box-shadow:5px 5px 0 var(--nero)}h1{-webkit-text-stroke:2px var(--nero);text-shadow:3px 3px 0 var(--nero)}.sub{font-size:15px}form{grid-template-columns:1fr}.countdown{gap:12px}.cd .num{font-size:46px}.cd .nome{font-size:22px}.cd .data{font-size:12px}.cd .badge{width:44px;height:44px;top:-18px}.griglia{grid-template-columns:1fr 1fr;gap:14px}.item h3{font-size:16px}.card{box-shadow:4px 4px 0 var(--nero)}.deco svg.hide-m{display:none}}
@media(max-width:380px){.griglia{grid-template-columns:1fr}}
</style>
</head>

<script>
const KEY='regali-vg-4a5c62cacdc853c2';
const API='https://textdb.online/';
const LS='regali-vg-cache';
let db={items:[],deleted:[]};
let imgCache={};
let filtro='tutte', fotoNuova=null, salvando=false;
const $=id=>document.getElementById(id);
const stato=t=>$('stato').textContent=t;

function giorni(m,d){const o=new Date();o.setHours(0,0,0,0);let t=new Date(o.getFullYear(),m,d);if(t<o)t=new Date(o.getFullYear()+1,m,d);return Math.round((t-o)/864e5)}
function cd(){const v=giorni(10,9),g=giorni(11,6);$('cdV').textContent=v===0?'🎉 Oggi!':v;$('cdG').textContent=g===0?'🎉 Oggi!':g}

async function leggi(k){const r=await fetch(API+k+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.text()}
async function scrivi(k,v){const b=new URLSearchParams();b.set('key',k);b.set('value',v);const r=await fetch(API+'update',{method:'POST',body:b});const j=await r.json();if(j.status!==1)throw new Error(j.error||'errore');}

function unisci(a,b){const del=new Set([...(a.deleted||[]),...(b.deleted||[])]);const m={};
 for(const it of [...(a.items||[]),...(b.items||[])]){if(del.has(it.id))continue;if(!m[it.id]||(it.upd||0)>(m[it.id].upd||0))m[it.id]=it}
 return{items:Object.values(m).sort((x,y)=>(y.creato||0)-(x.creato||0)),deleted:[...del].slice(-500)}}

async function carica(){
 try{const t=await leggi(KEY);const remoto=t&&t.trim()?JSON.parse(t):{items:[]};db=unisci({items:[],deleted:db.deleted},remoto);
   // tieni modifiche locali non ancora salvate
   localStorage.setItem(LS,JSON.stringify(db));stato('💗 sincronizzato');}
 catch(e){stato('⚠ offline: uso copia locale');}
 await caricaImmagini();mostra();
}
async function salva(){
 salvando=true;stato('✨ salvataggio…');
 try{let remoto={items:[]};try{const t=await leggi(KEY);if(t&&t.trim())remoto=JSON.parse(t)}catch(e){}
   db=unisci(remoto,db);
   // rispetta modifiche locali più recenti
   await scrivi(KEY,JSON.stringify(db));localStorage.setItem(LS,JSON.stringify(db));stato('💗 salvato per entrambe');}
 catch(e){localStorage.setItem(LS,JSON.stringify(db));stato('⚠ non salvato online: '+e.message);}
 salvando=false;mostra();
}
async function caricaImmagini(){
 await Promise.all(db.items.filter(i=>i.imgKey&&!imgCache[i.imgKey]).map(async i=>{
  const c=localStorage.getItem('img:'+i.imgKey);if(c){imgCache[i.imgKey]=c;return}
  try{const t=await leggi(i.imgKey);if(t.startsWith('data:image')){imgCache[i.imgKey]=t;try{localStorage.setItem('img:'+i.imgKey,t)}catch(e){}}}catch(e){}
 }));
}
function ridimensiona(file){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
 const max=480;let w=im.width,h=im.height;if(w>h&&w>max){h=h*max/w;w=max}else if(h>max){w=w*max/h;h=max}
 const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
 let q=.75,d=c.toDataURL('image/jpeg',q);while(d.length>150000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}ok(d)};im.onerror=ko;im.src=r.result};r.readAsDataURL(file)})}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function srcFoto(i){return i.imgKey?imgCache[i.imgKey]:i.imgUrl}
function mostra(){
 const q=$('cerca').value.toLowerCase().trim();
 const lista=db.items.filter(i=>(filtro==='tutte'||i.per===filtro)&&(!q||[i.nome,i.cat,i.note,i.link,i.per].join(' ').toLowerCase().includes(q)));
 $('cats').innerHTML=[...new Set(db.items.map(i=>i.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('');
 const emoji=['🐯','⭐','💗','🐱','🌙','✨','🎀'];
 $('griglia').innerHTML=lista.length?lista.map((i,n)=>{const s=srcFoto(i);return `<div class="card item">
  <div class="foto">${s?`<img src="${esc(s)}" alt="" loading="lazy" onerror="this.replaceWith('${emoji[n%7]}')">`:emoji[n%7]}</div>
  <div class="corpo"><h3>${esc(i.nome)}</h3>
  <div><span class="tag ${i.per==='Veronica'?'v':'gi'}">${esc(i.per)}</span>${i.cat?`<span class="tag c">${esc(i.cat)}</span>`:''}</div>
  ${i.prezzo?`<div class="prezzo">€ ${Number(i.prezzo).toFixed(2)}</div>`:''}
  ${i.link?`<a class="link" href="${esc(i.link)}" target="_blank" rel="noopener">🔗 vai al link</a>`:''}
  ${i.note?`<div class="note">${esc(i.note)}</div>`:''}
  <div class="azioni" style="margin-top:auto"><button class="sec" onclick="mod('${i.id}')">✏ Modifica</button><button class="sec" onclick="del('${i.id}')">🗑</button></div></div></div>`}).join('')
 :'<div class="vuoto"><svg viewBox="0 0 120 110" width="90"><path d="M20 30C14 8 46 2 60 14 76 2 108 8 102 34 118 50 112 84 92 92 80 108 40 108 28 94 6 88 2 52 20 30Z" fill="#ff8fb8" stroke="#1b1418" stroke-width="4"/><ellipse cx="44" cy="52" rx="7" ry="9" fill="#1b1418"/><ellipse cx="78" cy="52" rx="7" ry="9" fill="#1b1418"/><circle cx="46" cy="49" r="2.5" fill="#fff"/><circle cx="80" cy="49" r="2.5" fill="#fff"/><path d="M54 66q7 7 14 0" fill="none" stroke="#1b1418" stroke-width="4" stroke-linecap="round"/><ellipse cx="34" cy="66" rx="7" ry="4" fill="#e8417e" opacity=".6"/><ellipse cx="88" cy="66" rx="7" ry="4" fill="#e8417e" opacity=".6"/></svg>Ancora nessun desiderio… aggiungi il primo!</div>';
}
function reset(){$('form').reset();$('fid').value='';fotoNuova=null;$('anteprima').style.display='none';$('titoloForm').textContent='Aggiungi un desiderio ✨';$('annulla').style.display='none'}
function mod(id){const i=db.items.find(x=>x.id===id);if(!i)return;$('fid').value=id;$('fnome').value=i.nome;$('fper').value=i.per;$('flink').value=i.link||'';$('fimgurl').value=i.imgUrl||'';$('fprezzo').value=i.prezzo||'';$('fcat').value=i.cat||'';$('fnote').value=i.note||'';
 const s=srcFoto(i);if(s){$('anteprima').src=s;$('anteprima').style.display='block'}$('titoloForm').textContent='Modifica desiderio ✏️';$('annulla').style.display='';window.scrollTo({top:$('form').offsetTop-10,behavior:'smooth'})}
function del(id){if(!confirm('Eliminare questo desiderio?'))return;db.items=db.items.filter(x=>x.id!==id);db.deleted=[...(db.deleted||[]),id];salva()}

$('ffile').onchange=async e=>{const f=e.target.files[0];if(!f)return;fotoNuova=await ridimensiona(f);$('anteprima').src=fotoNuova;$('anteprima').style.display='block';$('fimgurl').value=''};
$('fimgurl').oninput=e=>{if(e.target.value){fotoNuova=null;$('anteprima').src=e.target.value;$('anteprima').style.display='block'}};
$('form').onsubmit=async e=>{e.preventDefault();const id=$('fid').value||(Date.now().toString(36)+Math.random().toString(36).slice(2,7));
 const vecchio=db.items.find(x=>x.id===id)||{creato:Date.now()};
 const it={...vecchio,id,nome:$('fnome').value.trim(),per:$('fper').value,link:$('flink').value.trim(),prezzo:$('fprezzo').value,cat:$('fcat').value.trim(),note:$('fnote').value.trim(),upd:Date.now()};
 const url=$('fimgurl').value.trim();
 if(fotoNuova){const k=KEY+'-img-'+id+'-'+Date.now().toString(36);stato('✨ carico la foto…');
   try{await scrivi(k,fotoNuova);it.imgKey=k;it.imgUrl='';imgCache[k]=fotoNuova;try{localStorage.setItem('img:'+k,fotoNuova)}catch(e){}}catch(err){alert('Foto non caricata: '+err.message)}}
 else if(url){it.imgUrl=url;delete it.imgKey}
 db.items=[it,...db.items.filter(x=>x.id!==id)];reset();mostra();await salva()};
$('annulla').onclick=reset;
$('cerca').oninput=mostra;
$('filtri').onclick=e=>{const b=e.target.closest('button');if(!b)return;filtro=b.dataset.f;[...$('filtri').children].forEach(x=>x.classList.toggle('on',x===b));mostra()};
$('esporta').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...db,img:imgCache})],{type:'application/json'}));a.download='regali-backup.json';a.click()};
$('importaBtn').onclick=()=>$('importa').click();
$('importa').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);Object.assign(imgCache,d.img||{});db=unisci(db,{items:(d.items||[]).map(i=>({...i,upd:Date.now()}))});salva()}catch(err){alert('File non valido')}};r.readAsText(f)};

try{const c=JSON.parse(localStorage.getItem(LS));if(c&&c.items)db=c}catch(e){}
cd();mostra();carica();
setInterval(()=>{if(!salvando&&document.visibilityState==='visible'&&!$('fid').value)carica()},20000);
</script>
</body>
